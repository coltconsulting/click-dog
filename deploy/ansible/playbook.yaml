---
# Click-Dog Deployment Playbook
#
# Deploys click-dog as a systemd sidecar on every ClickHouse node.
#
# Usage:
#   ansible-playbook -i inventory.ini playbook.yaml \
#     --extra-vars "clickhouse_password=YOUR_PASSWORD"
#
# Bound SSH concurrency to 10 hosts in flight at once:
#   ansible-playbook -i inventory.ini playbook.yaml \
#     --extra-vars "clickhouse_password=YOUR_PASSWORD" \
#     -f 10
#
# For batched rollouts that finish a wave before starting the next,
# add a play-level `serial: 10` keyword to this playbook below
# (it's a YAML keyword on the play, not an `ansible-playbook` CLI
# flag — `--serial` does not exist).

- name: Deploy click-dog sidecar to ClickHouse nodes
  hosts: "{{ target_hosts | default('clickhouse') }}"
  become: true
  vars:
    click_dog_user: click-dog
    click_dog_group: click-dog
    click_dog_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    click_dog_install_dir: /usr/local/bin
    click_dog_config_dir: /etc/click-dog
    click_dog_log_dir: /var/log/click-dog
    click_dog_installer_state_dir: /var/lib/click-dog-installer
    tls_cert_dir: /etc/click-dog/tls
    # Overridable settings get their defaults in the first task, not here:
    # play vars outrank inventory, and a play var that defaults itself is a
    # recursive template.

  handlers:
    - name: validate click-dog config
      ansible.builtin.command:
        cmd: /usr/local/bin/click-dog -validate -config {{ click_dog_config_dir }}/click-dog.yaml
      changed_when: false
      listen: restart click-dog

    - name: restart click-dog service
      ansible.builtin.systemd:
        name: click-dog
        state: restarted
        daemon_reload: true
      listen: restart click-dog

  tasks:
    # ── Defaults ─────────────────────────────────────────────────
    # set_fact reads whatever inventory or extra vars supplied before falling
    # back, so those override the defaults. Tagged always so --tags rollback
    # sees the same values.
    - name: Apply defaults for overridable settings
      ansible.builtin.set_fact:
        click_dog_version: "{{ click_dog_version | default('latest') }}"
        clickhouse_host: "{{ clickhouse_host | default('localhost') }}"
        clickhouse_port: "{{ clickhouse_port | default(9000) }}"
        clickhouse_username: "{{ clickhouse_username | default('click_dog_monitor') }}"
        otel_collector_address: "{{ otel_collector_address | default('localhost:4317') }}"
        # Off unless set: per-node sidecars need no Keeper for coverage.
        # Keeper hosts only add coordination (cluster-wide flush, /clusterz).
        keeper_hosts: "{{ keeper_hosts | default('[]') }}"
        # OTLP TLS to the collector. otel_secure is optional: unset, the
        # installed click-dog decides (plaintext only for a loopback
        # collector) and a TLS choice is checked by handshake. The
        # certificate paths are on the control node; set them per host in
        # inventory when each node has its own client certificate.
        otel_secure: "{{ otel_secure | default('') }}"
        otel_ca_cert: "{{ otel_ca_cert | default('') }}"
        otel_client_cert: "{{ otel_client_cert | default('') }}"
        otel_client_key: "{{ otel_client_key | default('') }}"
      tags: [always]

    - name: Derive HA mode and OTLP TLS material from their inputs
      ansible.builtin.set_fact:
        ha_enabled: "{{ keeper_hosts | string | length > 2 }}"
        otel_ca_enabled: "{{ otel_ca_cert | length > 0 }}"
        otel_mtls_enabled: "{{ otel_client_cert | length > 0 }}"
        otel_secure_set: "{{ otel_secure | string | length > 0 }}"
        # Any certificate material means TLS. --print-otel-secure has no
        # client-certificate input, so a loopback mTLS-only inventory must
        # not let it decide plaintext.
        otel_tls_material: "{{ otel_ca_cert | length > 0 or otel_client_cert | length > 0 or otel_client_key | length > 0 }}"
      tags: [always]

    # Fail before touching the host: a run that asked for TLS must not deploy
    # a plaintext exporter.
    - name: Reject the retired Let's Encrypt TLS variables
      ansible.builtin.assert:
        that:
          - not (tls_enabled | default(false) | bool)
        fail_msg: >-
          tls_enabled, tls_domain, and tls_email were removed. Let's Encrypt no
          longer issues client-authentication certificates, and a host's own
          certificate chain cannot verify the collector. TLS is the default
          for a collector that is not loopback; set otel_secure=true to
          require it, and, for a private CA or mutual TLS, otel_ca_cert,
          otel_client_cert, and otel_client_key; see
          https://click-dog.com/ansible/#otlp-tls.

    - name: Validate OTLP TLS inputs
      ansible.builtin.assert:
        that:
          - not (otel_secure_set | bool) or otel_secure | bool or not (otel_tls_material | bool)
          - (otel_client_cert | length > 0) == (otel_client_key | length > 0)
        fail_msg: >-
          otel_ca_cert, otel_client_cert, and otel_client_key only apply over
          TLS, so they cannot be combined with otel_secure=false; remove
          otel_secure=false or the certificate variables. otel_client_cert
          and otel_client_key must be set together.

    # The playbook cannot tell its own copies from files a guided install or
    # an operator put there (install.sh writes ca.pem to trust a self-signed
    # collector), so it never deletes them: a file on the host that the
    # inventory does not supply stops the run instead of being dropped.
    - name: Look for OTLP TLS files already on the host
      ansible.builtin.stat:
        path: "{{ tls_cert_dir }}/{{ item }}"
      loop: [ca.pem, client.crt, client.key]
      register: otel_tls_on_host

    - name: Refuse to drop OTLP TLS files the inventory does not supply
      ansible.builtin.assert:
        that:
          - otel_tls_unsupplied | length == 0
        fail_msg: >-
          {{ otel_tls_unsupplied | join(' and ') }} {{ 'is' if otel_tls_unsupplied | length == 1 else 'are' }}
          in {{ tls_cert_dir }} on this host, but the inventory does not
          supply {{ 'it' if otel_tls_unsupplied | length == 1 else 'them' }},
          so the rendered configuration would stop using
          {{ 'it' if otel_tls_unsupplied | length == 1 else 'them' }}. Either
          copy {{ 'it' if otel_tls_unsupplied | length == 1 else 'them' }} to
          the control node and set {{ otel_tls_unsupplied
          | map('extract', {'ca.pem': 'otel_ca_cert', 'client.crt': 'otel_client_cert', 'client.key': 'otel_client_key'})
          | join(' and ') }}, or remove
          {{ 'it' if otel_tls_unsupplied | length == 1 else 'them' }} from the
          host{{ '; without ca.pem the collector is verified against the system trust roots' if 'ca.pem' in otel_tls_unsupplied else '' }}.
      vars:
        otel_tls_supplied: >-
          {{ (['ca.pem'] if otel_ca_enabled | bool else [])
             + (['client.crt', 'client.key'] if otel_mtls_enabled | bool else []) }}
        otel_tls_unsupplied: >-
          {{ otel_tls_on_host.results | selectattr('stat.exists')
             | map(attribute='item') | reject('in', otel_tls_supplied) | list }}

    # ── System user ──────────────────────────────────────────────
    - name: Check for an existing click-dog system group
      ansible.builtin.command:
        cmd: getent group {{ click_dog_group }}
      register: click_dog_group_before
      changed_when: false
      failed_when: click_dog_group_before.rc not in [0, 2]

    - name: Check for an existing click-dog system user
      ansible.builtin.command:
        cmd: getent passwd {{ click_dog_user }}
      register: click_dog_user_before
      changed_when: false
      failed_when: click_dog_user_before.rc not in [0, 2]

    - name: Create click-dog system group
      ansible.builtin.group:
        name: "{{ click_dog_group }}"
        system: true
        state: present

    - name: Create click-dog system user
      ansible.builtin.user:
        name: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Read numeric ID of playbook-created click-dog user
      ansible.builtin.command:
        cmd: id -u {{ click_dog_user }}
      register: click_dog_created_user_id
      changed_when: false
      when: click_dog_user_before.rc != 0

    - name: Read numeric ID of playbook-created click-dog group
      ansible.builtin.command:
        cmd: getent group {{ click_dog_group }}
      register: click_dog_created_group
      changed_when: false
      when: click_dog_user_before.rc != 0 and click_dog_group_before.rc != 0

    - name: Create installer ownership state directory
      ansible.builtin.file:
        path: "{{ click_dog_installer_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: click_dog_user_before.rc != 0

    - name: Record playbook-created runtime user
      ansible.builtin.copy:
        content: "{{ click_dog_created_user_id.stdout | trim }}\n"
        dest: "{{ click_dog_installer_state_dir }}/installer-created-user"
        owner: root
        group: root
        mode: "0600"
      when: click_dog_user_before.rc != 0

    - name: Record playbook-created runtime group
      ansible.builtin.copy:
        content: "{{ click_dog_created_group.stdout.split(':')[2] }}\n"
        dest: "{{ click_dog_installer_state_dir }}/installer-created-group"
        owner: root
        group: root
        mode: "0600"
      when: click_dog_user_before.rc != 0 and click_dog_group_before.rc != 0

    # ── Directories ──────────────────────────────────────────────
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ click_dog_config_dir }}"
        state: directory
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0750"

    - name: Create log directory
      ansible.builtin.file:
        path: "{{ click_dog_log_dir }}"
        state: directory
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0750"

    # ── Binary ───────────────────────────────────────────────────
    # Four modes: explicit URL, versioned release, latest release, or local binary.
    # Official versioned/latest downloads both resolve a tag and use
    # releases/download/TAG/FILE so their signed assets share one trust path.

    - name: Back up current binary
      ansible.builtin.copy:
        src: "{{ click_dog_install_dir }}/click-dog"
        dest: "{{ click_dog_install_dir }}/click-dog.prev"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      failed_when: false  # OK if binary doesn't exist yet (first deploy)

    - name: Copy click-dog binary from local build
      ansible.builtin.copy:
        src: "{{ click_dog_local_binary | default('../../click-dog') }}"
        dest: "{{ click_dog_install_dir }}/click-dog"
        owner: root
        group: root
        mode: "0755"
      notify: restart click-dog
      when: click_dog_local_binary is defined

    - name: Report operator-provided binary source
      ansible.builtin.debug:
        msg: >-
          Binary source: operator-provided click_dog_local_binary; automatic
          release verification skipped.
      when: click_dog_local_binary is defined

    - name: Validate release download inputs
      ansible.builtin.assert:
        that:
          - click_dog_arch in ['amd64', 'arm64']
          - click_dog_download_url is defined or click_dog_version == 'latest' or click_dog_version is regex('^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$')
          - click_dog_download_url is not defined or (click_dog_download_checksum is defined and (click_dog_download_checksum | string) is regex('^[0-9a-fA-F]{64}$'))
        fail_msg: >-
          click_dog_version must be `latest` or a release tag such as v26.09.1
          (got '{{ click_dog_version }}'; replace the inventory example's
          vYY.MM.N placeholder), architectures must be amd64/arm64, and
          click_dog_download_url requires a trusted 64-character
          click_dog_download_checksum.
      when: click_dog_local_binary is not defined

    - name: Download and verify click-dog release archive
      when: click_dog_local_binary is not defined
      block:
        - name: Create private release staging directory
          ansible.builtin.tempfile:
            state: directory
            suffix: click-dog-release
          register: click_dog_release_staging

        - name: Restrict release staging directory permissions
          ansible.builtin.file:
            path: "{{ click_dog_release_staging.path }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Resolve latest release version from GitHub API
          ansible.builtin.uri:
            url: "https://api.github.com/repos/coltconsulting/click-dog/releases/latest"
            return_content: true
          register: latest_release
          when: click_dog_download_url is not defined and click_dog_version == 'latest'

        - name: Select official release tag
          ansible.builtin.set_fact:
            click_dog_release_tag: "{{ latest_release.json.tag_name if click_dog_version == 'latest' else click_dog_version }}"
          when: click_dog_download_url is not defined

        - name: Validate official release tag
          ansible.builtin.assert:
            that:
              - click_dog_release_tag is regex('^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$')
            fail_msg: "GitHub returned an invalid click-dog release tag."
          when: click_dog_download_url is not defined

        # GoReleaser archives omit the tag's leading v in the filename.
        - name: Select official release archive
          ansible.builtin.set_fact:
            click_dog_archive_name: "click-dog_{{ click_dog_release_tag | regex_replace('^v', '') }}_linux_{{ click_dog_arch }}.tar.gz"
            click_dog_release_base_url: "https://github.com/coltconsulting/click-dog/releases/download/{{ click_dog_release_tag }}"
          when: click_dog_download_url is not defined

        - name: Select mirrored release archive
          ansible.builtin.set_fact:
            click_dog_archive_name: click-dog-custom.tar.gz
          when: click_dog_download_url is defined

        - name: Download official release and checksum manifest
          ansible.builtin.get_url:
            url: "{{ click_dog_release_base_url }}/{{ item }}"
            dest: "{{ click_dog_release_staging.path }}/{{ item }}"
            owner: root
            group: root
            mode: "0600"
          loop:
            - "{{ click_dog_archive_name }}"
            - checksums.txt
          when: click_dog_download_url is not defined

        - name: Download checksum-pinned mirrored release
          ansible.builtin.get_url:
            url: "{{ click_dog_download_url }}"
            dest: "{{ click_dog_release_staging.path }}/{{ click_dog_archive_name }}"
            checksum: "sha256:{{ click_dog_download_checksum }}"
            owner: root
            group: root
            mode: "0600"
          # Mirror URLs may be pre-signed or contain bearer credentials.
          no_log: true
          when: click_dog_download_url is defined

        - name: Locate cosign for official release verification
          ansible.builtin.command:
            argv:
              - /bin/sh
              - -c
              - command -v cosign
          register: click_dog_cosign_path
          changed_when: false
          failed_when: false
          when: click_dog_download_url is not defined

        - name: Download official release signature assets when cosign is available
          ansible.builtin.get_url:
            url: "{{ click_dog_release_base_url }}/{{ item }}"
            dest: "{{ click_dog_release_staging.path }}/{{ item }}"
            owner: root
            group: root
            mode: "0600"
          loop:
            - checksums.txt.sig
            - checksums.txt.pem
          when:
            - click_dog_download_url is not defined
            - not (click_dog_dangerously_ignore_cosign | default(false) | bool)
            - click_dog_cosign_path.rc == 0

        - name: Warn when publisher authentication is unavailable
          ansible.builtin.debug:
            msg: >-
              cosign is not installed; continuing with checksum verification
              only. This detects download corruption but does not authenticate
              the publisher. Official Cosign installation documentation:
              https://docs.sigstore.dev/cosign/system_config/installation/
          when:
            - click_dog_download_url is not defined
            - not (click_dog_dangerously_ignore_cosign | default(false) | bool)
            - click_dog_cosign_path.rc != 0

        - name: Warn when publisher authentication is deliberately disabled
          ansible.builtin.debug:
            msg: >-
              DANGER: click_dog_dangerously_ignore_cosign is true; publisher
              authentication is deliberately disabled. The official archive
              will still be required to match its exact SHA-256.
          when:
            - click_dog_download_url is not defined
            - click_dog_dangerously_ignore_cosign | default(false) | bool

        - name: Verify official release checksum signature
          ansible.builtin.command:
            argv:
              - "{{ click_dog_cosign_path.stdout }}"
              - verify-blob
              - --certificate
              - "{{ click_dog_release_staging.path }}/checksums.txt.pem"
              - --signature
              - "{{ click_dog_release_staging.path }}/checksums.txt.sig"
              - --certificate-identity-regexp
              - '^https://github\.com/coltconsulting/click-dog/\.github/workflows/release\.yml@refs/tags/v.+$'
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - "{{ click_dog_release_staging.path }}/checksums.txt"
          changed_when: false
          # cosign may contact Rekor/Fulcio. Bound that network operation so a
          # blackholed endpoint fails closed without hanging a fleet rollout.
          async: 60
          poll: 5
          register: click_dog_cosign_verify
          failed_when: false
          when:
            - click_dog_download_url is not defined
            - not (click_dog_dangerously_ignore_cosign | default(false) | bool)
            - click_dog_cosign_path.rc == 0

        - name: Require successful cosign verification when attempted
          ansible.builtin.assert:
            that:
              - (click_dog_cosign_verify.rc | default(1)) == 0
            fail_msg: >-
              cosign verification was attempted and failed; checksum-only
              fallback was not used. Fix cosign/Sigstore access, or deliberately
              rerun with click_dog_dangerously_ignore_cosign=true while retaining
              mandatory SHA-256 verification.
          when:
            - click_dog_download_url is not defined
            - not (click_dog_dangerously_ignore_cosign | default(false) | bool)
            - click_dog_cosign_path.rc == 0

        - name: Compute downloaded official archive checksum
          ansible.builtin.stat:
            path: "{{ click_dog_release_staging.path }}/{{ click_dog_archive_name }}"
            checksum_algorithm: sha256
          register: click_dog_archive_stat
          when: click_dog_download_url is not defined

        - name: Read release checksums
          ansible.builtin.slurp:
            src: "{{ click_dog_release_staging.path }}/checksums.txt"
          register: click_dog_release_checksums
          when: click_dog_download_url is not defined

        - name: Verify archive is present in release checksums
          ansible.builtin.assert:
            that:
              - >-
                (click_dog_release_checksums.content | b64decode).splitlines()
                | select('match', '^' ~ click_dog_archive_stat.stat.checksum ~ '[ *]+' ~ (click_dog_archive_name | regex_escape) ~ '$')
                | list | length == 1
            fail_msg: "Downloaded archive does not match release checksums."
          when: click_dog_download_url is not defined

        - name: Report official release verification mode
          ansible.builtin.debug:
            msg: >-
              Release verification: {{
                'DANGER — publisher signature deliberately skipped'
                if (click_dog_dangerously_ignore_cosign | default(false) | bool)
                else ('publisher signature verified with cosign'
                if click_dog_cosign_path.rc == 0
                else 'publisher signature not verified because cosign is unavailable')
              }}; archive SHA-256 matched.
          when: click_dog_download_url is not defined

        - name: Report mirrored release verification mode
          ansible.builtin.debug:
            msg: >-
              Release source: mirrored archive; verified against the
              operator-supplied SHA-256.
          when: click_dog_download_url is defined

        - name: Extract verified click-dog archive
          ansible.builtin.unarchive:
            src: "{{ click_dog_release_staging.path }}/{{ click_dog_archive_name }}"
            dest: "{{ click_dog_install_dir }}"
            remote_src: true
          notify: restart click-dog
      always:
        - name: Remove release staging directory
          ansible.builtin.file:
            path: "{{ click_dog_release_staging.path }}"
            state: absent
          when: click_dog_release_staging is defined and click_dog_release_staging.path is defined

    # ── OTLP TLS ─────────────────────────────────────────────────
    # click-dog only dials out, so TLS material comes from the PKI that serves
    # the collector, not from this host: otel_ca_cert verifies the collector's
    # server certificate (the system roots do when it is unset), and the client
    # pair authenticates click-dog when the collector requires mTLS. These
    # copies are the paths click-dog.yaml.j2 renders.
    - name: Create TLS directory
      ansible.builtin.file:
        path: "{{ tls_cert_dir }}"
        state: directory
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0750"
      when: otel_ca_enabled | bool or otel_mtls_enabled | bool

    - name: Install the collector CA certificate
      ansible.builtin.copy:
        src: "{{ otel_ca_cert }}"
        dest: "{{ tls_cert_dir }}/ca.pem"
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0640"
      when: otel_ca_enabled | bool
      notify: restart click-dog

    - name: Install the OTLP client certificate
      ansible.builtin.copy:
        src: "{{ otel_client_cert }}"
        dest: "{{ tls_cert_dir }}/client.crt"
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0640"
      when: otel_mtls_enabled | bool
      # No restart: click-dog re-reads the client pair on each new collector
      # connection, and a restart would clear its dedup cache and resend
      # spans still inside the lookback window. A first-time mTLS setup still
      # restarts through the configuration change.

    - name: Install the OTLP client key
      ansible.builtin.copy:
        src: "{{ otel_client_key }}"
        dest: "{{ tls_cert_dir }}/client.key"
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0600"
      diff: false
      when: otel_mtls_enabled | bool
      # No restart, as for the certificate above.

    # Earlier playbooks installed this hook for a Let's Encrypt certificate
    # the configuration no longer uses; left behind, renewals would restart
    # click-dog. Hosts where it ran also hold copies of that certificate and
    # its private key. The certificate under /etc/letsencrypt is left to the
    # operator.
    - name: Remove the retired certbot renewal hook and certificate copies
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/letsencrypt/renewal-hooks/post/click-dog-restart.sh
        - "{{ tls_cert_dir }}/tls.crt"
        - "{{ tls_cert_dir }}/tls.key"
        - "{{ tls_cert_dir }}/fullchain.pem"

    # ── OTLP transport ───────────────────────────────────────────
    # Each host is the host that exports, so it decides as `install.sh
    # install` does: an unset otel_secure is answered by the click-dog just
    # installed (never by a copy of its rule here), and a TLS choice is checked
    # by handshake before the configuration is written. Both probes run the
    # binary already in place, since the release is extracted over the old
    # one; a host that fails here stops before its configuration is written
    # and before the restart handler runs.
    - name: Ask click-dog which OTLP transport the collector gets
      ansible.builtin.command:
        argv: >-
          {{ [click_dog_install_dir ~ '/click-dog', 'init', '--print-otel-secure',
              '--collector', otel_collector_address]
             + (['--otel-ca-cert', tls_cert_dir ~ '/ca.pem'] if otel_ca_enabled | bool else []) }}
      register: otel_transport_probe
      changed_when: false
      check_mode: false
      # A --check run of a first deploy has no binary yet; it previews TLS.
      failed_when: otel_transport_probe.rc != 0 and not ansible_check_mode
      when: not (otel_secure_set | bool)

    - name: Settle the OTLP transport
      ansible.builtin.set_fact:
        otel_transport_tls: >-
          {{ (otel_secure | bool) if (otel_secure_set | bool)
             else ((otel_tls_material | bool)
                   or ((otel_transport_probe.stdout | default('') | trim) or 'true') == 'true') }}

    - name: Render secure explicitly unless a loopback collector was left automatic
      ansible.builtin.set_fact:
        otel_secure_rendered: "{{ otel_secure_set | bool or otel_transport_tls | bool }}"

    # Scheme targets (dns:, passthrough:, unix:) are not host:port addresses
    # the check can dial, as in install.sh.
    - name: Check the OTLP receiver's TLS handshake
      ansible.builtin.command:
        argv: >-
          {{ [click_dog_install_dir ~ '/click-dog', 'test', 'tls',
              '--collector', otel_collector_address, '--json']
             + (['--ca-cert', tls_cert_dir ~ '/ca.pem'] if otel_ca_enabled | bool else [])
             + (['--client-cert', tls_cert_dir ~ '/client.crt',
                 '--client-key', tls_cert_dir ~ '/client.key'] if otel_mtls_enabled | bool else []) }}
      register: otel_tls_check
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - otel_transport_tls | bool
        - otel_collector_address is not match('(?i)^(dns|passthrough|unix|unix-abstract):')

    # test tls --json prints one indented object; exit 1 is any verdict but
    # ok, so the verdict decides. An inconclusive check (receiver not up yet,
    # a binary that cannot run, no JSON) is a note, as in install.sh.
    - name: Read the OTLP TLS check
      ansible.builtin.set_fact:
        otel_tls_result: "{{ otel_tls_check.stdout | from_json if (otel_tls_check.stdout | default('') | trim).startswith('{') else {} }}"
      when: otel_tls_check is not skipped

    - name: Note an inconclusive OTLP TLS check
      ansible.builtin.debug:
        msg: >-
          TLS to {{ otel_collector_address }} not verified
          ({{ otel_tls_result.message | default('click-dog test tls gave no verdict') }});
          `click-dog check` tests it once the service runs.
      when:
        - otel_tls_check is not skipped
        - (otel_tls_result.verdict | default('unknown')) == 'unknown'
        - (otel_tls_result.reason | default('')) != 'config' or ansible_check_mode

    - name: Stop on an OTLP receiver that does not match the transport
      ansible.builtin.fail:
        msg: >-
          {{ otel_collector_address }} failed the TLS check click-dog would
          export with: {{ otel_tls_result.verdict }}{{ ' (' ~ otel_tls_result.reason ~ ')' if otel_tls_result.reason | default('') else '' }}:
          {{ otel_tls_result.message | default('') }}.
          {% if otel_tls_result.verdict == 'plaintext' %}The receiver serves plaintext;
          set otel_secure=false to export in plaintext, or enable TLS on the receiver.
          {% elif otel_tls_result.verdict == 'untrusted' and not otel_ca_enabled | bool %}Set
          otel_ca_cert to the CA that signed the collector's certificate.
          {% elif otel_tls_result.verdict == 'client-cert' %}The collector requires a client
          certificate; set otel_client_cert and otel_client_key.
          {% endif %}See https://click-dog.com/ansible/#otlp-tls.
      when:
        - otel_tls_check is not skipped
        - (otel_tls_result.verdict | default('unknown')) != 'ok'
        - (otel_tls_result.verdict | default('unknown')) != 'unknown'
          or ((otel_tls_result.reason | default('')) == 'config' and not ansible_check_mode)

    # ── Configuration ────────────────────────────────────────────
    # Write the password to a 0600 file the click-dog user owns; the config
    # references it via clickhouse.password_file. This keeps the secret out of
    # the group-readable (0640) click-dog.yaml and matches install.sh. The file
    # is the raw password with no trailing newline (copy preserves content
    # exactly; click-dog also trims one trailing newline defensively).
    - name: Write click-dog ClickHouse password file
      ansible.builtin.copy:
        content: "{{ clickhouse_password }}"
        dest: "{{ click_dog_config_dir }}/.secret"
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0600"
      no_log: true
      notify: restart click-dog

    - name: Deploy click-dog configuration
      ansible.builtin.template:
        src: click-dog.yaml.j2
        dest: "{{ click_dog_config_dir }}/click-dog.yaml"
        owner: "{{ click_dog_user }}"
        group: "{{ click_dog_group }}"
        mode: "0640"
      notify: restart click-dog

    # ── Systemd ──────────────────────────────────────────────────
    - name: Deploy systemd unit file
      ansible.builtin.template:
        src: click-dog.service.j2
        dest: /etc/systemd/system/click-dog.service
        owner: root
        group: root
        mode: "0644"
      notify: restart click-dog

    - name: Enable and start click-dog
      ansible.builtin.systemd:
        name: click-dog
        enabled: true
        state: started
        daemon_reload: true

    # ── Verification ─────────────────────────────────────────────
    - name: Wait for click-dog to start
      ansible.builtin.wait_for:
        timeout: 5

    - name: Check click-dog is running
      ansible.builtin.systemd:
        name: click-dog
      register: click_dog_status

    - name: Check click-dog health endpoint
      ansible.builtin.uri:
        url: "http://localhost:8686/healthz"
        status_code: 200
      retries: 6
      delay: 5

    - name: Report status
      ansible.builtin.debug:
        msg: "click-dog on {{ inventory_hostname }}: {{ click_dog_status.status.ActiveState }}"

    # ── Rollback (run with: ansible-playbook --tags rollback) ────
    # `never` keeps these out of an untagged run, which would otherwise move
    # the backup it just took back over the binary it just installed.
    - name: Check .prev binary exists
      ansible.builtin.stat:
        path: "{{ click_dog_install_dir }}/click-dog.prev"
      register: click_dog_prev
      tags: [rollback, never]

    - name: Rollback binary (atomic mv)
      ansible.builtin.command:
        cmd: mv {{ click_dog_install_dir }}/click-dog.prev {{ click_dog_install_dir }}/click-dog
      when: click_dog_prev.stat.exists
      notify: restart click-dog
      tags: [rollback, never]

    - name: Warn if no .prev binary available
      ansible.builtin.debug:
        msg: "No .prev binary found — this node has no rollback target (first deploy?)"
      when: not click_dog_prev.stat.exists
      tags: [rollback, never]
