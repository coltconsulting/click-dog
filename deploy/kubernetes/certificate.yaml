# cert-manager Let's Encrypt integration for click-dog.
#
# Prerequisites:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#
# Usage:
#   1. Replace YOUR_EMAIL with a real address (Let's Encrypt expiry notifications).
#   2. Start with letsencrypt-staging to test, then switch to letsencrypt-prod.
#   3. Apply: kubectl apply -f deploy/kubernetes/certificate.yaml

---
# Staging issuer — use this first to avoid rate limits while testing.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Production issuer — switch to this after staging works.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Certificate for the OTEL collector endpoint.
# cert-manager will automatically renew before expiry.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: click-dog-otel-tls
  namespace: click-dog
spec:
  secretName: click-dog-otel-tls
  duration: 2160h    # 90 days
  renewBefore: 720h  # renew 30 days before expiry
  issuerRef:
    name: letsencrypt-staging   # switch to letsencrypt-prod when ready
    kind: ClusterIssuer
  dnsNames:
    - otel-collector.example.com   # replace with your collector FQDN
