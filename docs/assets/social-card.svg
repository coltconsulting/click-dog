<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Click-Dog social card</title>
  <desc id="desc">Source-safe query observability for ClickHouse.</desc>
  <!-- Keep this card's copy in sync with the homepage and site metadata. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f5f1"/>
      <stop offset="0.58" stop-color="#f7f3eb"/>
      <stop offset="1" stop-color="#f7dfb5"/>
    </linearGradient>
    <linearGradient id="accentText" x1="80" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2960c"/>
      <stop offset="0.5" stop-color="#b06fb2"/>
      <stop offset="1" stop-color="#6f55ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#21160a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#7a4b12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1040" cy="64" r="290" fill="#f2960c" fill-opacity="0.08"/>

  <g filter="url(#softShadow)">
    <g transform="translate(78 85) scale(0.185)" fill="#111827">
      <path fill-rule="evenodd" d="M2 528.52c0-.26 4.65-6.23 10.34-13.25 50.37-62.24 80.86-124.5 88.17-180.07 2.99-22.72 2.62-26.15-13.98-129.2-5.18-32.18-9.3-58.04-16.63-104.5C58.3 27.94 55.95 11.73 56.59 9.59 57.87 5.35 62.12 2 66.22 2c3.91 0 5.29.86 41.78 26.15 3.58 2.48 13.25 9.14 21.5 14.81 8.25 5.66 15.78 10.98 16.73 11.81 1.57 1.36 2.22 1.13 7-2.52 20.64-15.78 51.7-28.91 81.99-34.67 74.03-14.09 159.96 19.04 195.1 75.21 12.13 19.4 13.03 20.57 17.68 22.88 2.48 1.22 14.18 4.9 26 8.17 72.82 20.13 115.94 32.44 118.92 33.94 4.31 2.17 6.97 5.74 7.72 10.41.58 3.55-9.09 27.27-34.52 84.65-9.32 21.04-22.04 33.11-42.62 40.44-9.93 3.54-17.48 4.43-57 6.76-19.25 1.14-37.75 2.7-41.12 3.47-15.96 3.65-31.05 13.94-40.33 27.49-17.8 25.97-18.04 48.58-1.17 110.02 10.17 37.02 23.12 85.67 23.12 86.85 0 .84-52.82 1.13-202.5 1.13C93.12 529 2 528.78 2 528.52M84 41l40 261 54.02-64.65 47.55 78.76 35.96-21.71-47.55-78.75L294 186Zm260.73 95.87a21.51 21.51 0 1 0 43.03 0 21.51 21.51 0 1 0-43.03 0"/>
    </g>
    <text x="190" y="148" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#1c1813">Click-Dog</text>
  </g>

  <g font-family="Inter, DejaVu Sans, Arial, sans-serif">
    <text x="84" y="310" font-size="68" font-weight="900" fill="#171412">Source-safe query</text>
    <text x="84" y="392" font-size="68" font-weight="900" fill="url(#accentText)">observability for ClickHouse.</text>

    <text x="84" y="461" font-size="28" font-weight="500" fill="#5a544a">
      <tspan x="84" dy="0">Traces, query families &amp; dashboards for Datadog, Splunk, Honeycomb,</tspan>
      <tspan x="84" dy="40">Grafana Tempo &amp; OTLP backends &#8212; read-only, never in the request path.</tspan>
    </text>
  </g>

  <g font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace" font-size="22" font-weight="600">
    <g transform="translate(84 556)">
      <rect width="188" height="46" rx="23" fill="#fff9ef" stroke="#f2960c" stroke-width="2"/>
      <text x="24" y="30" fill="#f2960c">Apache-2.0</text>
    </g>
    <g transform="translate(288 556)">
      <rect width="174" height="46" rx="23" fill="#faf7ff" stroke="#7c5cff" stroke-width="2"/>
      <text x="23" y="30" fill="#7c5cff">Read-only</text>
    </g>
    <g transform="translate(478 556)">
      <rect width="232" height="46" rx="23" fill="#f4f8ff" stroke="#2e77e5" stroke-width="2"/>
      <text x="23" y="30" fill="#2e77e5">Single binary</text>
    </g>
  </g>
</svg>
