name: Claude Code Review

on:
  pull_request:
    # Was [opened, synchronize] — re-reviewing on every commit push burned
    # minutes (and Claude credits) on agent branches that push many WIP
    # commits. Now reviews once when the PR opens and again when a draft is
    # marked ready. Comment `@claude review` to trigger an ad-hoc re-review.
    types: [opened, ready_for_review]

# One review per PR; cancel an in-flight review if a newer trigger lands.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      # Check permission before checkout so pull-request content cannot
      # influence the authorization decision.
      - name: Check repository admin permission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          is_admin="$(
            gh api \
              "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" \
              --jq '.user.permissions.admin' 2>/dev/null || true
          )"

          if [[ "${is_admin}" == "true" ]]; then
            echo "authorized=true" >> "${GITHUB_OUTPUT}"
          else
            echo "authorized=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Ignoring Claude review trigger from non-admin actor ${ACTOR}."
          fi

  claude-review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
