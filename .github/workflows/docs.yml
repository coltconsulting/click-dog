name: Docs

# PRs: lightweight `mkdocs build --strict` validation only.
# master pushes: validation.
# tag pushes: validation + deploy to gh-pages (deploy job is gated below).
# workflow_dispatch: on-demand trigger.
on:
  push:
    tags:
      - 'v*'
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:  # no paths filter — manual runs always execute the full pipeline

# Cancel superseded PR runs so rapid pushes (esp. from agent branches)
# don't stack overlapping mkdocs builds. Tag/master runs use a per-ref
# group and are never cancelled — the deploy job must run to completion.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build (strict)
        run: mkdocs build --strict

  deploy:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build and deploy
        run: mkdocs gh-deploy --force
