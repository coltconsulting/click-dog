name: Release

# Tag-triggered wrapper around ci.yml. The cosign keyless identity is the
# workflow file that runs the signing step (`.../release.yml@refs/tags/v...`)
# — the updater (internal/updater/github.go) and the installer
# (deploy/install.sh) both hardcode that path, so this file must remain
# the home of the signing step even after ci.yml was generalised into a
# reusable workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One in-flight release per tag. Releases must run to completion, so no
# cancel-in-progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the full CI gate (test/lint/build/build-arm64/govulncheck/
  # integration-test) via the reusable entry point in ci.yml. Failing here
  # blocks the release step below.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    # Build/sign/publish only in the PUBLIC repo. release.yml ships to the
    # public tree, so a GA tag triggers this workflow in BOTH repos; without
    # this guard GoReleaser runs twice (two Releases, two ghcr pushes) and only
    # the public one is ever consumed. Internal is gate-only (the `ci` job
    # above); public is the sole artifact builder, and its cosign identity is
    # the one deploy/install.sh and internal/updater/github.go pin. See
    # docs/development/specs/release-build-dedup.md.
    if: github.repository == 'coltconsulting/click-dog'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Required for cosign keyless signing via GitHub OIDC: GoReleaser's
      # signs:/docker_signs: blocks shell out to cosign sign-blob/sign,
      # which exchanges this token for a Fulcio-issued signing certificate.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check GoReleaser config
        # Keep this separate from the release step so schema/config errors
        # fail before any publish/signing work starts.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: check

      - name: Install cosign
        # Pin the action SHA to prevent tag drift. Keep the installed binary
        # on Cosign 2.6.1 while GoReleaser and release verification consume
        # detached .sig/.pem files; Cosign 3 requires a bundle migration.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.1'

      - name: Run GoReleaser
        # SHA-pinned for the same reason as cosign-installer above: this
        # step runs the signing flow, and a hijacked @v7 tag could
        # produce unsigned (or wrongly-signed) artifacts. The other
        # actions in this workflow stay on floating tags by repo
        # convention — they don't affect the signed-artifact chain.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Released $TAG"
          echo "Binaries: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "Docker:   ghcr.io/${{ github.repository }}:${TAG#v}"
