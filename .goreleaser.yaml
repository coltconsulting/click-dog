version: 2

# The repo is coltconsulting/click-dog-internal, so GoReleaser would otherwise
# derive the project name — and thus the default binary and artifact names —
# from the git remote as "click-dog-internal". Pin it: shipped artifacts and the
# binary are "click-dog", which is also what the Dockerfile COPYs
# (${TARGETPLATFORM}/click-dog). Without this pin the docker build fails with
# "/linux/<arch>/click-dog: not found" (the v26.07.1 release failure).
project_name: click-dog

builds:
  - id: click-dog
    binary: click-dog
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      # Specifying `files` overrides GoReleaser's implicit license/readme
      # bundling, so re-list them here or they drop out of the tarball.
      - LICENSE
      - README.md
      # Public starter configs, parity-pinned to `click-dog init --profile` by
      # TestWizard_ParityWithProfileTemplates. These live outside the private
      # docs site so the exact public export tree contains every archive input.
      - src: examples/click-dog-*.yaml
        dst: examples
        strip_parent: true

checksum:
  name_template: 'checksums.txt'
  # The installer is itself a release asset. Include it in the manifest that
  # is signed below so operators can authenticate the bootstrap script before
  # running it as root, not only the archive that the script later downloads.
  extra_files:
    - glob: ./deploy/install.sh
      name_template: install.sh

# Cosign keyless signing of checksums.txt via GitHub OIDC + Fulcio. The
# manifest covers both release archives and the install.sh bootstrap script.
# Produces checksums.txt.sig (signature) and checksums.txt.pem (cert chain
# tied to the release workflow identity). The updater verifies these on
# self-update; manual verification is documented in docs/install.md.
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - --yes
    artifacts: checksum

dockers_v2:
  # Versioned image — always pushed. The tag is the bare {{ .Version }}
  # (e.g. 26.05.1 or 26.05.1-alpha) for every release.
  - id: versioned
    ids:
      - click-dog
    dockerfile: Dockerfile
    images:
      - "{{ .Env.CLICK_DOG_IMAGE_REPOSITORY }}"
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # The release workflow pins this to the repository that owns the channel:
    # private internal for alpha, public for GA. Do not derive it from a checkout
    # remote or allow one channel to claim the other channel's source identity.
    labels:
      org.opencontainers.image.source: "{{ .Env.CLICK_DOG_SOURCE_REPOSITORY }}"
      org.opencontainers.image.url: "https://click-dog.com"
      org.opencontainers.image.documentation: "https://click-dog.com"

  # `latest` image — same content, separate block so we can gate the
  # whole entry with a templated disable. Prerelease tags
  # (v…-alpha/-beta/-test) skip the block so users on :latest stay on the
  # most recent GA.
  - id: latest
    ids:
      - click-dog
    dockerfile: Dockerfile
    images:
      - "{{ .Env.CLICK_DOG_IMAGE_REPOSITORY }}"
    tags:
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: "{{ .Env.CLICK_DOG_SOURCE_REPOSITORY }}"
      org.opencontainers.image.url: "https://click-dog.com"
      org.opencontainers.image.documentation: "https://click-dog.com"
    disable: "{{ if .Prerelease }}true{{ else }}false{{ end }}"

# Cosign keyless signing of pushed images. Signs by digest.
#
# Prereleases: only the versioned block publishes (latest is disabled),
# so one image, one signature.
#
# GA releases: both blocks publish. They are EXPECTED to produce
# identical digests (same Dockerfile, same binaries, same platforms,
# same buildx setup), in which case cosign signs the one digest twice
# — idempotent at the Rekor level. This is behavioral rather than
# structural: if the two buildx invocations ever drift (timestamps,
# build-arg ordering, base-image float), :{{ .Version }} and :latest
# will point to different digests with separate signatures. Verify on
# the first GA cut:
#   docker buildx imagetools inspect ghcr.io/coltconsulting/click-dog:{{ .Version }}
#   docker buildx imagetools inspect ghcr.io/coltconsulting/click-dog:latest
# If they diverge, the cheap fix is replacing the second block with a
# `docker buildx imagetools create --tag …:latest …:{{ .Version }}`
# post-publish step gated on !Prerelease — same digest by construction.
docker_signs:
  - cmd: cosign
    artifacts: images
    output: true
    args:
      - sign
      - '${artifact}@${digest}'
      - --yes

release:
  # `auto` flags any tag with a semver prerelease suffix (-alpha.1/-alpha.1/etc.)
  # as a GitHub prerelease. Combined with the conditional `latest` docker tag
  # above, this means prereleases never displace the GA on either surface.
  prerelease: auto
  # Keep the verified installer available at:
  # https://github.com/coltconsulting/click-dog/releases/latest/download/install.sh
  # (GitHub serves /releases/latest from the most recent NON-prerelease.)
  extra_files:
    # Internal alpha Releases also contain this public-channel installer for
    # config/reference parity. It deliberately remains wired to public GA and
    # must not be used to install the private alpha binary.
    - glob: ./deploy/install.sh
      name_template: install.sh
  # A release page whose whole body is one commit SHA tells a tester nothing.
  # The commit list still renders under this header. Wording stays true on
  # every channel: internal alpha pages are built from this same config, and
  # the public changelog does not describe an alpha, so this points at the
  # changelog without promising an entry for this specific tag.
  header: |
    Release notes for the published versions: https://click-dog.com/changelog/

    Verify the download before installing — see
    https://click-dog.com/verify-releases/. Prereleases are opt-in:
    `click-dog self-update --prerelease`, or `install.sh --prerelease`.
  footer: |

    ---
    click-dog is pre-1.0. Read STATUS.txt in the tree for what is not yet
    stable before pinning a deployment to this tag.

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
